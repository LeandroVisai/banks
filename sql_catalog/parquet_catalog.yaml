version: "1.0"
parquet_dir: data_pipeline/parquet

datasets:

  # -- afp --

  - id: allocation_int_nac
    file: allocation_int_nac.parquet
    chart_type: "multi_line_dual"
    facts: {composition_exclude: ["AUM"]}   # AUM (US$ Mill, eje der.) NO entra a la composicion de allocation %
    name: "Distribución internacional vs local"
    description: >
      Serie de distribución internacional vs local para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas Nacional, Extranjero, AUM. Cubre el período entre 2008-09-30 y 2026-04-30. La unidad principal de análisis es %. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "%"
    date_range: ["2008-09-30", "2026-05-29"]
    columns:
      - {name: "fecha", type: TIMESTAMP}
      - {name: "Nacional", type: DOUBLE}
      - {name: "Extranjero", type: DOUBLE}
      - {name: "AUM", type: DOUBLE}

  - id: attribution
    file: attribution.parquet
    chart_type: "bar_scatter_dual"
    value_scale: 100.0   # Valor/Retorno vienen en FRACCION (~0,08) -> x100 = % (chart Y texto)
    name: "Distribución fondos por clase de activos"
    description: >
      Serie de distribución fondos por clase de activos para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por fondo (A, B, C, D, E), Clase. Incluye las métricas Valor, Retorno. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "%"
    date_range: []
    columns:
      - {name: "fondo", type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: "Clase", type: VARCHAR, values: ["Dolares", "RFI", "RFN", "RVI", "RVN", "Residuo", "Swap_CLP", "Swap_USD"]}
      - {name: "Valor", type: DOUBLE}
      - {name: "Retorno", type: DOUBLE}

  - id: cambiario_afp
    file: cambiario_afp.parquet
    chart_type: "bar_scatter_dual"
    value_kind: "flow"   # flujo cambiario (entrada/salida); la ventana se SUMA
    # Formato LARGO: una fila por (Fecha, Sector_contraparte, Tipo). El dato relevante
    # del texto es el Neto por AFP → se filtra Tipo=Neto sobre la col de valor Monto.
    facts: {category: "Sector_contraparte", value: "Monto", filter: {Tipo: "Neto"}}
    name: "Flujo cambiario (US$ Mill.)"
    description: >
      Serie de flujo cambiario (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Sector_contraparte y Tipo (Spot, Forward, Neto = Spot + Forward). Incluye la métrica Monto. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: []
    columns:
      - {name: "Fecha", type: VARCHAR}
      - {name: "Sector_contraparte", type: VARCHAR, values: ["Capital", "Cuprum", "Habitat", "Modelo", "Planvital", "Provida", "Uno"]}
      - {name: "Tipo", type: VARCHAR, values: ["Neto", "Spot", "Forward"]}
      - {name: "Monto", type: DOUBLE}

  - id: dv01_spc_afp
    file: dv01_spc_afp.parquet
    chart_type: "line"
    value_kind: "stock"   # DV01 = sensibilidad (nivel), no flujo
    facts: {exclude: {moneda: ["UF"]}}   # el chart excluye UF; el texto tambien
    name: "DV01 proyectado en swap por moneda (US$ Mill.)"
    description: >
      Serie de dv01 proyectado en swap por moneda (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por moneda (CLP, UF, US$). Incluye las métricas dv01. Cubre el período entre 2020-01-31 y 2026-06-01. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2020-01-31", "2026-07-14"]
    columns:
      - {name: "fecha", type: TIMESTAMP}
      - {name: "moneda", type: VARCHAR, values: ["CLP", "UF", "US$"]}
      - {name: "dv01", type: DOUBLE}

  - id: movimientos_fondos
    file: movimientos_fondos.parquet
    chart_type: "stacked_bar"
    value_kind: "flow"   # traspasos diarios entre fondos (entrada/salida); la ventana se SUMA
    name: "Traspaso de cotizantes entre fondos (US$ Mill.)"
    description: >
      Serie de traspaso de cotizantes entre fondos (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por fondo (A, B, C, D, E). Incluye las métricas flujos_usd. Cubre el período entre 2026-04-30 y 2026-05-28. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2026-06-12", "2026-07-10"]
    columns:
      - {name: "fecha", type: TIMESTAMP}
      - {name: "fondo", type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: "flujos_usd", type: DOUBLE}

  - id: mtm_afp
    file: mtm_afp.parquet
    chart_type: "line"
    value_kind: "stock"   # MtM = valuacion (nivel), no flujo; la variacion es nivel fin-inicio
    name: "MtM swaps por tipo de fondo (US$ Mill.)"
    description: >
      Serie de mtm swaps por tipo de fondo (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por fondo (A, B, C, D, E). Incluye las métricas mtm. Cubre el período entre 2020-01-31 y 2026-06-01. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2020-01-31", "2026-07-14"]
    columns:
      - {name: "fecha", type: TIMESTAMP}
      - {name: "fondo", type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: "mtm", type: DOUBLE}

  - id: posicion_spot_derivados_afp
    file: posicion_spot_derivados.parquet
    chart_type: "pos_delta_interactive"
    name: "Posición Spot y Derivados (MM USD) — AFP"
    description: >
      Serie de posición spot y derivados (mm usd) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Agente (TGR), Mercado (Spot). Incluye las métricas Monto. Cubre el período entre 2014-10-01 y 2026-05-29. La unidad principal de análisis es MM USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "MM USD"
    date_range: ["2014-10-01", "2026-07-13"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Agente", type: VARCHAR, values: ["TGR"]}
      - {name: "Mercado", type: VARCHAR, values: ["Spot"]}
      - {name: "Monto", type: DOUBLE}

  - id: spot_derivados_afp
    file: spot_derivados_afp.parquet
    chart_type: "bar_neto_cum_interactive"
    value_kind: "flow"   # flujos diarios spot/derivados (el chart les hace cumsum); la ventana se SUMA
    name: "Posición spot y derivados acumulada (US$ Mill.)"
    description: >
      Serie de posición spot y derivados acumulada (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas Derivados, Spot. Cubre el período entre 2025-04-28 y 2026-05-29. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2024-01-02", "2026-07-13"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Derivados", type: DOUBLE}
      - {name: "Spot", type: DOUBLE}

  - id: stock_bucket_afp
    file: stock_bucket_afp.parquet
    chart_type: "stacked_area"
    value_kind: "stock"   # stock DCV por tramo (nivel)
    name: "Stock DCV AFP por tramo de plazo (US$ Mill.)"
    description: >
      Serie de stock dcv afp por tramo de plazo (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Bucket (Entre 1 y 2Y, Entre 2 y 5Y, Entre 5 y 10Y, Mayor a 10Y, Menor a 1Y). Incluye las métricas Stock_USD. Cubre el período entre 2019-01-02 y 2026-05-29. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2019-01-02", "2026-07-14"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Bucket", type: VARCHAR, values: ["Entre 1 y 2Y", "Entre 2 y 5Y", "Entre 5 y 10Y", "Mayor a 10Y", "Menor a 1Y"]}
      - {name: "Stock_USD", type: DOUBLE}

  - id: stock_fondo_afp
    file: stock_fondo_afp.parquet
    chart_type: "stacked_area"
    value_kind: "stock"   # stock de fondos por tipo (nivel)
    name: "Stock Fondos (US$ Mill.)"
    description: >
      Serie de stock fondos (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por fondo (A, B, C, D, E). Incluye las métricas mmus. Cubre el período entre 2010-01-29 y 2026-04-30. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2010-01-29", "2026-05-29"]
    columns:
      - {name: "fecha", type: TIMESTAMP}
      - {name: "fondo", type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: "mmus", type: DOUBLE}

  - id: stock_nivel_afp
    file: stock_nivel_afp.parquet
    chart_type: "stacked_area"
    value_kind: "stock"   # stock DCV por instrumento (nivel)
    name: "Stock DCV AFP por instrumento (US$ Mill.)"
    description: >
      Serie de stock dcv afp por instrumento (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Tipo. Incluye las métricas Stock_USD. Cubre el período entre 2019-01-02 y 2026-05-29. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2019-01-02", "2026-07-14"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Tipo", type: VARCHAR, values: ["BB", "BCCh", "BTP", "BTU", "DAP", "Letras MdH", "Otros", "PDBC"]}
      - {name: "Stock_USD", type: DOUBLE}

  - id: variacion_stock_afp
    file: variacion_stock_afp.parquet
    chart_type: "grouped_bar"
    value_kind: "stock"   # NIVELES de stock DCV (el chart calcula la delta  T-7 / T-30); NO sumar
    name: "Variación Stock DCV AFP (US$ Mill.)"
    description: >
      Serie de variación stock dcv afp (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Bucket (Entre 1 y 2Y, Entre 2 y 5Y, Entre 5 y 10Y, Mayor a 10Y, Menor a 1Y), Tipo, Moneda (CLP, UF). Incluye las métricas Stock_USD. Cubre el período entre 2019-01-02 y 2026-05-29. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: ["2019-01-02", "2026-07-14"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Bucket", type: VARCHAR, values: ["Entre 1 y 2Y", "Entre 2 y 5Y", "Entre 5 y 10Y", "Mayor a 10Y", "Menor a 1Y"]}
      - {name: "Tipo", type: VARCHAR, values: ["BB", "BCCh", "BTP", "BTU", "DAP", "Letras MdH", "Otros", "PDBC"]}
      - {name: "Moneda", type: VARCHAR, values: ["CLP", "UF"]}
      - {name: "Stock_USD", type: DOUBLE}


  # -- bancos --

  - id: act_mn
    file: act_mn.parquet
    chart_type: "stacked_area"
    name: "Activos en moneda local"
    description: >
      Serie de activos en moneda local para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Tipo_banco (Bancos Sistemicos, Otros Bancos), Categoria_general (Colocaciones, Inversiones, Otros activos, Reservas bancarias). Incluye las métricas Monto. Cubre el período entre 2017-11-17 y 2026-05-27. La unidad principal de análisis es monto. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "monto"
    date_range: ["2017-11-17", "2026-07-10"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR}
      - {name: "Tipo_banco", type: VARCHAR, values: ["Bancos Sistemicos", "Otros Bancos"]}
      - {name: "Categoria_general", type: VARCHAR, values: ["Colocaciones", "Inversiones", "Otros activos", "Reservas bancarias"]}
      - {name: "Monto", type: DOUBLE}

  - id: act_mx
    file: act_mx.parquet
    chart_type: "stacked_area"
    name: "Activos en moneda extranjera"
    description: >
      Serie de activos en moneda extranjera para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Tipo_banco (Bancos Sistemicos, Otros Bancos), Categoria_general (Colocaciones, Inversiones, Otros activos, Reservas bancarias). Incluye las métricas Monto. Cubre el período entre 2017-11-17 y 2026-05-27. La unidad principal de análisis es monto. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "monto"
    date_range: ["2017-11-17", "2026-07-10"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR}
      - {name: "Tipo_banco", type: VARCHAR, values: ["Bancos Sistemicos", "Otros Bancos"]}
      - {name: "Categoria_general", type: VARCHAR, values: ["Colocaciones", "Inversiones", "Otros activos", "Reservas bancarias"]}
      - {name: "Monto", type: DOUBLE}

  - id: bonos_y_dap
    file: bonos_y_dap.parquet
    chart_type: "stacked_area"
    name: "Bonos y DAP por banco (MM USD)"
    description: >
      Serie de bonos y dap por banco (mm usd) para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Categoria general (BB, DAP). Incluye las métricas Monto. Cubre el período entre 2017-11-17 y 2026-05-27. La unidad principal de análisis es MM USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "MM USD"
    date_range: ["2017-11-17", "2026-07-10"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR}
      - {name: "Categoria general", type: VARCHAR, values: ["BB", "DAP"]}
      - {name: "Monto", type: DOUBLE}

  - id: bonos_y_dap_por_categoria
    file: bonos_y_dap_por_categoria.parquet
    chart_type: "stacked_area"
    name: "Bonos y DAP (MM USD)"
    description: >
      Serie de bonos y dap (mm usd) para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Categoria general (BB, DAP). Incluye las métricas Monto. Cubre el período entre 2017-11-17 y 2026-05-27. La unidad principal de análisis es MM USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "MM USD"
    date_range: ["2017-11-17", "2026-07-10"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR}
      - {name: "Categoria general", type: VARCHAR, values: ["BB", "DAP"]}
      - {name: "Monto", type: DOUBLE}

  - id: caja_bancos
    file: caja_bancos.parquet
    chart_type: "stacked_area"
    name: "Caja por banco (MM$)"
    description: >
      Serie de caja por banco (mm$) para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco. Incluye las métricas Monto. Cubre el período entre 2019-01-02 y 2026-05-29. La unidad principal de análisis es MM$. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "MM$"
    date_range: ["2019-01-02", "2026-07-14"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR, values: ["BCI", "BICE", "BTG", "Bank of China", "Chile", "China Construction Bank", "Consorcio", "Do Brasil", "Estado", "Falabella", "HSBC", "Internacional", "Itaú-Corpbanca", "JP Morgan", "Ripley", "Santander", "Scotiabank", "Security", "Tanner", "Tokyo"]}
      - {name: "Monto", type: DOUBLE}

  - id: emision_bb
    file: emision_bb.parquet
    chart_type: "stacked_bar"
    name: "Emisiones de bonos por banco y moneda (MM USD)"
    description: >
      Serie de emisiones de bonos por banco y moneda (mm usd) para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Moneda (CLP, UF). Incluye las métricas Monto. La unidad principal de análisis es MM USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "MM USD"
    date_range: []
    columns:
      - {name: "Banco", type: VARCHAR, values: ["BCI", "BICE", "BTG", "Chile", "Consorcio", "Estado", "Falabella", "Internacional", "Itaú-Corpbanca", "Ripley", "Santander", "Scotiabank", "Tanner"]}
      - {name: "Moneda", type: VARCHAR, values: ["CLP", "UF"]}
      - {name: "Monto", type: DOUBLE}

  - id: inv_por_banco
    file: inv_por_banco.parquet
    chart_type: "stacked_area"
    name: "Inversiones por banco (MM$)"
    description: >
      Serie de inversiones por banco (mm$) para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Instrumentos (BCCh, MdH, Otros, PDBC). Incluye las métricas Stock. Cubre el período entre 2019-01-02 y 2026-05-29. La unidad principal de análisis es MM$. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "MM$"
    date_range: ["2019-01-02", "2026-07-13"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR, values: ["BCI", "BICE", "BTG", "Bank of China", "Chile", "China Construction Bank", "Consorcio", "Estado", "Falabella", "HSBC", "Internacional", "Itaú-Corpbanca", "JP Morgan", "Ripley", "Santander", "Scotiabank", "Security", "Tanner"]}
      - {name: "Instrumentos", type: VARCHAR, values: ["BCCh", "MdH", "Otros", "PDBC"]}
      - {name: "Stock", type: DOUBLE}

  - id: inv_por_instrumento
    file: inv_por_instrumento.parquet
    chart_type: "stacked_area"
    name: "Inversiones por instrumento (MM$)"
    description: >
      Serie de inversiones por instrumento (mm$) para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Instrumentos (BCCh, MdH, Otros, PDBC). Incluye las métricas Stock. Cubre el período entre 2019-01-02 y 2026-05-29. La unidad principal de análisis es MM$. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "MM$"
    date_range: ["2019-01-02", "2026-07-13"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Banco", type: VARCHAR, values: ["BCI", "BICE", "BTG", "Bank of China", "Chile", "China Construction Bank", "Consorcio", "Estado", "Falabella", "HSBC", "Internacional", "Itaú-Corpbanca", "JP Morgan", "Ripley", "Santander", "Scotiabank", "Security", "Tanner"]}
      - {name: "Instrumentos", type: VARCHAR, values: ["BCCh", "MdH", "Otros", "PDBC"]}
      - {name: "Stock", type: DOUBLE}

  - id: pas_mn
    file: pas_mn.parquet
    chart_type: "stacked_area"
    name: "Pasivos en moneda local"
    description: >
      Serie de pasivos en moneda local para el seguimiento del segmento de bancos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Banco, Tipo_banco (Bancos Sistemicos, Otros Bancos), Categoria_general. Incluye las métricas Monto. Cubre el período entre 2017-11-17 y 2026-05-27. La unidad principal de análisis es monto. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: bancos
    unit: "monto"
    date_range: ["2017-11-17", "2026-07-10"]
    columns:
