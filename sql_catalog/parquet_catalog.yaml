    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Tipo_instrumento", type: VARCHAR, values: ["BB", "BCP", "BCU", "BE", "BTP", "BTU", "BU", "CFM", "DPC", "DPL", "Otro_RF", "Otro_RV", "PDBC"]}
      - {name: "Tipo_fondo", type: VARCHAR, values: ["Tipo 1", "Tipo 2", "Tipo 3", "Tipo 4", "Tipo 5", "Tipo 6", "Tipo 7", "Tipo 8"]}
      - {name: "Monto_USD", type: DOUBLE}

  - id: var_cartera_mensual_ffmm_tipo_f
