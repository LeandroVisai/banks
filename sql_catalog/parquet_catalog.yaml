    description: >
      Cartera mensual (allocation) por tipo de instrumento y tipo de fondo. Se desagrega por Tipo_instrumento (BB, BCP, BCU, BE, BTP, BTU, BU, CFM, DPC, DPL, Otro_RF, Otro_RV, PDBC) y Tipo_fondo (Tipo 1..Tipo 8), con la métrica Monto_USD. El parquet trae Monto_USD en MILES de USD, por eso value_scale 0.001 lo lleva a Mill US$. Útil para allocation por tipo de fondo (T1/T2/T3/T6) y la variación mensual/YtD de la cartera. La unidad es Mill US$.
    segment: ffmm
    unit: "Mill US$."
