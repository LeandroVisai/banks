      - {name: "Retorno", type: DOUBLE}

  - id: retorno_acum_ffmm
    file: retorno_acum_ffmm.parquet
    chart_type: "line"
    # return_index: índice de retorno acumulado GEOMÉTRICO en fracción desde 2019.
    # La variación de una ventana es el retorno COMPUESTO (1+i_t)/(1+i_s)-1, no la
    # resta del índice; el texto y el gráfico YTD lo computan geométricamente.
    value_kind: "return_index"
    name: "Rentabilidad acumulada por tipo de fondo (%)"
    description: >
      Serie ancha de rentabilidad acumulada por tipo de fondo: una columna por tipo (Tipo 1..Tipo 8). El parquet viene en FRACCIÓN (0,58 = 58%) y acumula desde 2019 (no resetea por año), por eso value_scale 100 la lleva a porcentaje. Útil para el gráfico de rentabilidad acumulada por tipo de fondo (multi-línea).
    segment: ffmm
    unit: "%"
    value_scale: 100.0
    date_range: ["2019-01-01", "2026-07-13"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Tipo 1", type: DOUBLE}
      - {name: "Tipo 2", type: DOUBLE}
      - {name: "Tipo 3", type: DOUBLE}
      - {name: "Tipo 4", type: DOUBLE}
      - {name: "Tipo 5", type: DOUBLE}
      - {name: "Tipo 6", type: DOUBLE}
      - {name: "Tipo 7", type: DOUBLE}
      - {name: "Tipo 8", type: DOUBLE}

  - id: flujos_fondo_ffmm
    file: flujos_fondo_ffmm.parquet
    chart_type: "line"
    value_kind: "flow"   # flujos diarios NETOS por tipo de fondo (entrada/salida); la ventana se SUMA
    # El parquet viene en MILES de USD (valores ~13.000-20.000/día por fondo solo
    # tienen sentido como ×0.001 = US$13-20M/día). Sin esto el informe mostraba
    # ~1,27 billones; ×0.001 lo lleva a US$ Mill. (total mensual ~1.276 Mill.,
    # del mismo orden que flujos_ffmm).
    value_scale: 0.001
    name: "Flujos diarios por tipo de fondo (US$ Mill.)"
    description: >
      Serie de flujos diarios por tipo de fondo para el seguimiento del segmento de fondos mutuos. Se desagrega por Tipo (Tipo 1..Tipo 8) e incluye la métrica Flujo. La unidad principal es US$ Mill.
    segment: ffmm
    unit: "US$ Mill."
    date_range: ["2019-01-01", "2026-07-13"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Tipo", type: VARCHAR, values: ["Tipo 1", "Tipo 2", "Tipo 3", "Tipo 4", "Tipo 5", "Tipo 6", "Tipo 7", "Tipo 8"]}
      - {name: "Flujo", type: DOUBLE}

  - id: var_cartera_mensual_ffmm
