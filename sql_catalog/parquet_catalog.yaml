datasets:

  # -- afp --

  - id: afp_var_aum_fondos
    file: afp_var_aum_fondos.parquet
    chart_type: "stacked_neto_interactive"
    name: "Variación acumulada flujos por fondo"
    description: >
      Serie de variación acumulada flujos por fondo para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas A, B, C, D, E. Cubre el período entre 2023-01-03 y 2026-07-24. La unidad principal de análisis es Millones de USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "Millones de USD"
    date_range: ["2023-01-03", "2026-08-06"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: A, type: DOUBLE}
      - {name: B, type: DOUBLE}
      - {name: C, type: DOUBLE}
      - {name: D, type: DOUBLE}
      - {name: E, type: DOUBLE}
  
  - id: mtm_afp_moneda
    file: mtm_afp_moneda.parquet
    chart_type: "line"
    name: "MtM swaps por moneda"
    description: >
      Serie de mtm swaps por moneda para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Moneda (CLP, UF, USD). Incluye las métricas MtM. Cubre el período entre 2020-01-31 y 2026-07-09. La unidad principal de análisis es Millones de USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "Millones de USD"
    date_range: ["2020-01-31", "2026-08-07"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: Moneda, type: VARCHAR, values: ["CLP", "UF", "USD"]}
      - {name: MtM, type: DOUBLE}

  - id: retorno_acum_afp
    file: retorno_acum_afp.parquet
    chart_type: "variation_line_interactive"
    name: "Retornos acumulados por fondo"
    description: >
      Serie de retornos acumulados por fondo para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas A, B, C, D, E. Cubre el período entre 2023-01-03 y 2026-07-24. La unidad principal de análisis es Porcentaje. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "Porcentaje"
    date_range: ["2023-01-03", "2026-08-06"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: A, type: DOUBLE}
      - {name: B, type: DOUBLE}
      - {name: C, type: DOUBLE}
      - {name: D, type: DOUBLE}
      - {name: E, type: DOUBLE}

  - id: retorno_mensual_afp
    file: retorno_mensual_afp.parquet
    chart_type: "grouped_bar"
    name: "Retorno mensuales por fondo"
    description: >
      Serie de retorno mensuales por fondo para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Fondo (A, B, C, D, E). Incluye las métricas Retorno. Cubre el período entre 2023-01-31 y 2026-06-30. La unidad principal de análisis es Porcentaje. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "Porcentaje"
    date_range: ["2023-01-01", "2026-08-01"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: AFP, type: VARCHAR, values: ["Capital", "Cuprum", "Habitat", "Modelo", "Planvital", "Provida", "Total", "Uno"]}
      - {name: Fondo, type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: Retorno, type: DOUBLE}

  - id: allocation_categoria
    file: allocation_categoria.parquet
    chart_type: "multi_line_dual"
    name: "Distribución inversiones por categoria"
    description: >
      Serie de distribución inversiones por categoria para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas RFN, RVN, RFI, RVI, Otros, AUM. Cubre el período entre 2008-09-30 y 2026-05-29. La unidad principal de análisis es Porcentaje y Millones de USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "%"
    date_range: ["2008-09-30", "2026-06-30"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: RFN, type: DOUBLE}
      - {name: RVN, type: DOUBLE}
      - {name: RFI, type: DOUBLE}
      - {name: RVI, type: DOUBLE}
      - {name: Otros, type: DOUBLE}
      - {name: AUM, type: DOUBLE}

  - id: allocation_fondo_categoria
    file: allocation_fondo_categoria.parquet
    chart_type: "multi_line_dual"
    name: "Distribución inversiones por fondo y categoria"
    description: >
      Serie de distribución inversiones por fondo y categoria para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Fondo (A, B, C, D, E). Incluye las métricas RFN, RVN, RFI, RVI, Otros, AUM. Cubre el período entre 2008-09-30 y 2026-05-29. La unidad principal de análisis es Porcentaje y Millones de USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "%"
    date_range: ["2008-09-30", "2026-06-30"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: Fondo, type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: RFN, type: DOUBLE}
      - {name: RVN, type: DOUBLE}
      - {name: RFI, type: DOUBLE}
      - {name: RVI, type: DOUBLE}
      - {name: Otros, type: DOUBLE}
      - {name: AUM, type: DOUBLE}



  - id: afp_posicion_swap_usd
