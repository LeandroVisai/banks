# -- cambiarioam (Informe Cambiario AM) --
 # Generados por scripts/build_cambiario_parquets.py desde el Excel "Datos BI
 # Informe Cambiario.xlsm" + 7 consultas al DW. Los parquets todavia NO estan
 # copiados a data_pipeline/parquet: los bloques del spec salen como "sin datos"
 # hasta que lleguen. Tras copiarlos, correr scripts/refresh_catalog_dates.py.
  - id: cam_drivers_snapshot
    file: cam_drivers_snapshot.parquet
    chart_type: "market_monitor_table"
    name: "Snapshot de mercado · drivers del CLP"
    description: >
      Niveles diarios de los cinco drivers que el Informe Cambiario AM sigue en su tabla de portada (cobre COMEX, DXY, spread SPC-OIS a 1 año, petróleo Brent y punta forward 30D), junto al cierre del CLP. La tabla de variación día / semana y el signo de su impacto sobre el peso se calculan sobre estas columnas.
    segment: cambiarioam
    unit: "niveles"
    value_kind: level
    date_range: ["2019-07-30", "2026-07-07"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: CLP Cierre, type: DOUBLE}
      - {name: Cobre, type: DOUBLE}
      - {name: DXY, type: DOUBLE}
      - {name: SPC 1Y, type: DOUBLE}
      - {name: OIS 1Y, type: DOUBLE}
      - {name: Petróleo, type: DOUBLE}
      - {name: Punta FWD 1M, type: DOUBLE}
  - id: cam_monedas_variacion_dia
    file: cam_monedas_variacion_dia.parquet
    chart_type: "variation_bar"
    name: "Variación de monedas en el día"
    description: >
      Variación porcentual de la última sesión de cada moneda del panel Bloomberg (bbg_monedas), ordenada de mayor a menor. Es el gráfico de apertura del informe: muestra de un vistazo qué monedas se apreciaron y cuáles se depreciaron contra el dólar.
    segment: cambiarioam
    unit: "%"
    value_kind: return
    date_range: []
    columns:
      - {name: Pais, type: VARCHAR}
      - {name: Variacion, type: DOUBLE}
  - id: cam_clp_intradia
    file: cam_clp_intradia.parquet
    chart_type: "line"
    name: "CLP, DXY y cobre intradía (base 100)"
    description: >
      Evolución intradía del peso, el índice dólar y el cobre llevados a base 100 al inicio de la ventana, para leer en la misma escala si el movimiento del CLP viene del dólar global, del cobre o es idiosincrático.
    segment: cambiarioam
    unit: "Índice base 100"
    value_kind: level
    date_range: ["2026-07-07", "2026-07-07"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: CLP, type: DOUBLE}
      - {name: DXY, type: DOUBLE}
      - {name: Cobre, type: DOUBLE}
  - id: cam_clp_ohlc
    file: cam_clp_ohlc.parquet
    chart_type: "candlestick"
    name: "Evolución del tipo de cambio (OHLC)"
    description: >
      Apertura, máximo, mínimo y cierre diarios del USD/CLP más el monto transado de la rueda. Es la vela del informe: el rango intradía se lee en la mecha y el cuerpo marca si la sesión cerró sobre o bajo la apertura.
    segment: cambiarioam
    unit: "CLP/USD"
    value_kind: level
    date_range: ["2019-07-30", "2026-07-07"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: Apertura, type: DOUBLE}
      - {name: Máximo, type: DOUBLE}
      - {name: Mínimo, type: DOUBLE}
      - {name: Cierre, type: DOUBLE}
      - {name: Monto transado, type: DOUBLE}
  - id: cam_clp_medias_moviles
    file: cam_clp_medias_moviles.parquet
    chart_type: "multi_line_dual"
    name: "CLP y medias móviles"
    description: >
      Cierre del USD/CLP contra sus medias móviles (10, 20, 50, 100 y 200 días) y la media móvil de 5 días del monto transado en el eje derecho. Las de 50 y 200 días son las que marcan el cruce dorado / de la muerte. Las columnas de media móvil llegan con el nombre que traiga el Excel (todas las que contienen 'Media móvil'), por eso no van declaradas acá: la transform toma todas las columnas numéricas del parquet.
    segment: cambiarioam
    unit: "CLP/USD"
    value_kind: level
    date_range: ["2019-07-30", "2026-07-07"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: CLP Cierre, type: DOUBLE}
      - {name: Monto transado (MM5d), type: DOUBLE}
  - id: cam_clp_bollinger
    file: cam_clp_bollinger.parquet
    chart_type: "line"
    name: "CLP · bandas de Bollinger"
    description: >
      Cierre del USD/CLP como insumo de las bandas de Bollinger de 20 días (media ± 2 desviaciones estándar). Las bandas se calculan en la transform, así se recalculan solas cuando llega una sesión nueva.
    segment: cambiarioam
    unit: "CLP/USD"
    value_kind: level
    date_range: ["2019-07-30", "2026-07-07"]
    columns:
