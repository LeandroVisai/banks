    chart_type: "stacked_area"
    name: "Cartera mensual por instrumento (variante tipo de fondo flexible)"
    description: >
      Variante de la cartera mensual (allocation) por tipo de instrumento y tipo de fondo, con la clasificación de fondo flexible (tipo_f). Mismas columnas que var_cartera_mensual_ffmm: Tipo_instrumento, Tipo_fondo (Tipo 1..Tipo 8) y Monto_USD. El parquet trae Monto_USD en MILES de USD, por eso value_scale 0.001 lo lleva a Mill US$. La unidad es Mill US$.
    segment: ffmm
    unit: "Mill US$."
    value_scale: 0.001
    date_range: ["2019-01-31", "2026-05-31"]
    columns:
      - {name: "Fecha", type: TIMESTAMP}
      - {name: "Tipo_instrumento", type: VARCHAR, values: ["BB", "BCP", "BCU", "BE", "BTP", "BTU", "BU", "CFM", "DPC", "DPL", "Otro_RF", "Otro_RV", "PDBC"]}
      - {name: "Tipo_fondo", type: VARCHAR, values: ["Tipo 1", "Tipo 2", "Tipo 3", "Tipo 4", "Tipo 5", "Tipo 6", "Tipo 7", "Tipo 8"]}
