      - {name: Tramo, type: VARCHAR, values: ["10Y", "1Y", "2Y", "5Y"]}
      - {name: Exposicion, type: DOUBLE}
      - {name: mmusd, type: DOUBLE}
      - {name: Plazo, type: VARCHAR, values: ["10Y", "1Y", "2Y", "5Y"]}

  - id: afp_posicion_spc
