    name: "Posición Spot y Derivados (MM USD) — FFMM"
    description: >
      Serie de posición spot y derivados (mm usd) para el seguimiento del segmento de fondos mutuos. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Agente (TGR), Mercado (Spot). Incluye las métricas Monto. Cubre el período entre 2014-10-01 y 2026-05-29. La unidad principal de análisis es MM USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: ffmm
    unit: "MM USD"
    date_range: ["2014-10-01", "2026-06-10"]
    # value_scale=-1: la serie es posición acumulada de USD VENDIDOS por TGR (signo
    # negativo en el dato origen). El informe de Mercado Cambiario de la gerencia la
    # muestra como positivo (USD vendidos → posición larga del mercado frente a TGR).
    # Si la magnitud también necesita ajuste (e.g. ×0.001 si el origen está en miles),
    # cambiar a value_scale=-0.001 y verificar contra el informe de referencia.
    value_scale: -1.0
