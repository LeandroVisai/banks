    chart_type: "bar_scatter_dual"
    value_kind: "flow"
    facts: {category: "Sector_contraparte", value: "Monto", filter: {Tipo: "Neto"}}   # el dato relevante es el Neto por AFP (no la 1ª col Spot)
    name: "Flujo cambiario (US$ Mill.)"
    description: >
      Serie de flujo cambiario (us$ mill.) para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Sector_contraparte, _title_override (Flujo cambiario AFP (US$ Mill.) · 22-05 al 29-05-2026). Incluye las métricas Spot, Forward, Neto. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "US$ Mill."
    date_range: []
    columns:
      - {name: "Fecha", type: VARCHAR}
      - {name: "Sector_contraparte", type: VARCHAR, values: ["Capital", "Cuprum", "Habitat", "Modelo", "Planvital", "Provida", "Uno"]}
      - {name: "Tipo", type: VARCHAR, values: ["Neto","Spot","Forward"]}
      - {name: "Monto", type: DOUBLE}

  - id: dv01_spc_afp
