  - id: retornos_fondo_ffmm
    file: retornos_fondo_ffmm.parquet
    chart_type: "grouped_bar"
    value_kind: "return"   # retornos diarios (no flujo): la direccion es el signo de la variacion
    name: "Retornos diarios por tipo de fondo (%)"
    description: >
      Serie de retornos diarios por tipo de fondo para el seguimiento del segmento de fondos mutuos. Se desagrega por Tipo (Tipo 1..Tipo 8) e incluye la métrica Retorno. Útil para la rentabilidad por ventana (7d, 30d, YtD) y la rentabilidad mensual por tipo de fondo.
