      Serie de posicion swap en dólares para el seguimiento del segmento de Fondos de Pensiones. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por Tramo (10Y, 1Y, 2Y, 5Y), Plazo (10Y, 1Y, 2Y, 5Y). Incluye las métricas mmusd. Cubre el período entre 2019-09-30 y 2026-07-31. La unidad principal de análisis es Millones de USD. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
