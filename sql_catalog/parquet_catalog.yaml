  - id: allocation_int_nac
    file: allocation_int_nac.parquet
    chart_type: "multi_line_dual"
    facts: {composition_exclude: ["AUM"]}   # AUM (US$ Mill, eje der.) NO entra a la composición de allocation %
    name: "Distribución internacional vs local"
    description: >
      Serie de distribución internacional vs local para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas Nacional, Extranjero, AUM. Cubre el período entre 2008-09-30 y 2026-04-30. La unidad principal de análisis es %. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "%"
    date_range: ["2008-09-30", "2026-05-29"]
    columns:
      - {name: "fecha", type: TIMESTAMP}
      - {name: "Nacional", type: DOUBLE}
      - {name: "Extranjero", type: DOUBLE}
      - {name: "AUM", type: DOUBLE}

  - id: attribution
    file: attribution.parquet
    chart_type: "bar_scatter_dual"
    value_scale: 100.0   # Valor/Retorno vienen en FRACCIÓN (~0,08) → ×100 = % (chart Y texto)
    name: "Distribución fondos por clase de activos"
    description: >
      Serie de distribución fondos por clase de activos para el seguimiento del segmento de AFP. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Se desagrega por fondo (A, B, C, D, E), Clase. Incluye las métricas Valor, Retorno. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: afp
    unit: "%"
    date_range: []
    columns:
      - {name: "fondo", type: VARCHAR, values: ["A", "B", "C", "D", "E"]}
      - {name: "Clase", type: VARCHAR, values: ["Dolares", "RFI", "RFN", "RVI", "RVN", "Residuo", "Swap_CLP", "Swap_USD"]}
      - {name: "Valor", type: DOUBLE}
      - {name: "Retorno", type: DOUBLE}

  - id: cambiario_afp
