# sql_catalog/catalog.yaml
# Catálogo de queries analíticas sobre parquets del DW.
#
# Cada entrada = una pregunta analítica que el agente puede responder.
# Las queries son DuckDB SQL sobre read_parquet('{snapshots_dir}/...').
#
# Parámetros de sustitución:
#   {snapshots_dir}  → ruta absoluta al directorio de parquets (inyectada por catalog_loader)
#   {fecha_inicio}   → fecha ISO (YYYY-MM-DD)
#   {fecha_fin}      → fecha ISO (YYYY-MM-DD)
#   {limit}          → entero máximo de filas (default 200)
#
# Todos los parquets son long format: (date TIMESTAMP, series_id VARCHAR, value DOUBLE, [tenor VARCHAR])
# Para curvas completas se usa PIVOT de DuckDB.
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"
snapshots_dir: data_pipeline/snapshots   # relativo a la raíz del repo; catalog_loader lo hace absoluto

queries:

  # ── MERCADO CAMBIARIO ─────────────────────────────────────────────────────

  - query_id: usdclp_historico
    name: "Tipo de cambio USD/CLP histórico"
    description: >
      Serie diaria del dólar estadounidense en pesos chilenos (USD/CLP).
      Fuente: mesadineOLTP_.mercado.divisas. Útil para preguntas sobre el dólar,
      nivel del tipo de cambio, depreciación/apreciación del peso chileno.
    segment: mercado_cambiario
    tags: [dolar, USD, CLP, tipo de cambio, divisas, peso chileno, paridad, FX]
    parquet: fx.parquet
    sql: |
      SELECT strftime(date, '%Y-%m-%d') AS fecha, value AS usdclp
      FROM read_parquet('{snapshots_dir}/fx.parquet')
      WHERE series_id = 'usdclp'
        AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      ORDER BY date DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
        description: "Fecha de inicio (YYYY-MM-DD)"
      - name: fecha_fin
        type: date
        default: "hoy"
        description: "Fecha de fin (YYYY-MM-DD)"
      - name: limit
        type: int
        default: 200
    unit: "CLP por USD"
    frequency: diario
    columns: [fecha, usdclp]

  - query_id: indice_monedas_latam
    name: "Índice de monedas LATAM y comparables"
    description: >
      Índices de monedas latinoamericanas (LATAM), monedas comparables a Chile
      y monedas de países exportadores de commodities. Mide la fortaleza
      relativa del CLP frente a su grupo de pares.
    segment: mercado_cambiario
    tags: [monedas, LATAM, comparables, commodities, índice, CLP relativo, pares]
    parquet: fx.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/fx.parquet')
        WHERE series_id IN ('monedas_latam', 'monedas_comparables', 'monedas_commodities')
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "índice base"
    frequency: diario
    columns: [fecha, monedas_latam, monedas_comparables, monedas_commodities]

  - query_id: forwards_clp_curva
    name: "Forwards USD/CLP ajustados (30, 90, 180, 360 días)"
    description: >
      Forwards del dólar-peso ajustados por plazos de 30, 90, 180 y 360 días.
      Útil para preguntas sobre expectativas de tipo de cambio futuro, mercado
      de forwards, cobertura cambiaria.
    segment: mercado_cambiario
    tags: [forwards, FWD, dolar, CLP, plazo, cobertura, derivados cambiarios]
    parquet: forwards_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/forwards_clp.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "CLP por USD"
    frequency: diario
    columns: [fecha, fwd_clp_30, fwd_clp_90, fwd_clp_180, fwd_clp_360]

  - query_id: microestructura_fx
    name: "Microestructura mercado cambiario (spread bid-ask, volatilidad, monto)"
    description: >
      Indicadores de microestructura del mercado spot USD/CLP: spread promedio
      de puntas bid-ask (%), volatilidad diaria de precio de transacciones,
      y monto transado en pesos chilenos. Mide liquidez y eficiencia del mercado.
    segment: mercado_cambiario
    tags: [bid ask, spread, volatilidad, monto transado, microestructura, liquidez mercado, spot]
    parquet: microestructura.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/microestructura.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "mixto (%, CLP)"
    frequency: diario
    columns: [fecha, spread_bid_ask_clp, vol_diaria_clp, monto_transado_spot_clp]

  # ── RENTA FIJA CHILE ──────────────────────────────────────────────────────

  - query_id: curva_btp_clp
    name: "Curva de rendimiento BTP (bonos del BCCh en pesos)"
    description: >
      Tasas de los bonos del Banco Central de Chile en pesos (BTP) para todos
      los plazos disponibles: 1Y, 2Y, 5Y, 7Y, 10Y, 15Y, 20Y, 25Y, 30Y.
      Útil para preguntas sobre la curva soberana en CLP, pendiente de la curva,
      tasas de largo plazo en pesos.
    segment: renta_fija_chile
    tags: [BTP, bonos, pesos, CLP, curva soberana, renta fija, BCCh, tasas largo plazo]
    parquet: bonos_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/bonos_clp.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, btp_1y, btp_2y, btp_5y, btp_7y, btp_10y, btp_15y, btp_20y, btp_25y, btp_30y]

  - query_id: curva_btu_uf
    name: "Curva de rendimiento BTU (bonos del BCCh en UF)"
    description: >
      Tasas reales de los bonos del Banco Central de Chile en Unidades de Fomento
      (BTU/UF): 2Y, 5Y, 7Y, 10Y, 15Y, 20Y, 25Y, 30Y. Útil para preguntas sobre
      tasas reales de largo plazo, curva UF, comparación BTP vs BTU.
    segment: renta_fija_chile
    tags: [BTU, bonos UF, tasa real, inflación, curva UF, renta fija real, BCCh, BEI]
    parquet: bonos_uf.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/bonos_uf.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual real"
    frequency: diario
    columns: [fecha, btu_2y, btu_5y, btu_7y, btu_10y, btu_15y, btu_20y, btu_25y, btu_30y]

  - query_id: btp_btu_comparado
    name: "BTP vs BTU en plazos 5Y y 10Y (break-even de inflación implícita)"
    description: >
      Compara directamente bonos nominales (BTP) y reales (BTU) en los plazos
      5 y 10 años. La diferencia aproxima el break-even de inflación (BEI) implícita
      en el mercado. Útil para preguntas sobre expectativas de inflación de largo plazo.
    segment: renta_fija_chile
    tags: [BTP, BTU, break-even inflación, BEI, inflación implícita, 5Y, 10Y, nominal vs real]
    parquet: bonos_clp.parquet
    sql: |
      SELECT
        strftime(n.date, '%Y-%m-%d') AS fecha,
        n.value AS btp_5y,
        r5.value AS btu_5y,
        n.value - r5.value AS bei_5y,
        n10.value AS btp_10y,
        r10.value AS btu_10y,
        n10.value - r10.value AS bei_10y
      FROM read_parquet('{snapshots_dir}/bonos_clp.parquet') n
      JOIN read_parquet('{snapshots_dir}/bonos_uf.parquet') r5
        ON strftime(n.date, '%Y-%m-%d') = strftime(r5.date, '%Y-%m-%d') AND r5.series_id = 'btu_5y'
      JOIN read_parquet('{snapshots_dir}/bonos_clp.parquet') n10
        ON strftime(n.date, '%Y-%m-%d') = strftime(n10.date, '%Y-%m-%d') AND n10.series_id = 'btp_10y'
      JOIN read_parquet('{snapshots_dir}/bonos_uf.parquet') r10
        ON strftime(n.date, '%Y-%m-%d') = strftime(r10.date, '%Y-%m-%d') AND r10.series_id = 'btu_10y'
      WHERE n.series_id = 'btp_5y'
        AND n.date >= '{fecha_inicio}' AND n.date <= '{fecha_fin}'
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, btp_5y, btu_5y, bei_5y, btp_10y, btu_10y, bei_10y]

  - query_id: spc_clp_curva
    name: "Curva Swap Promedio Cámara en pesos (SPC CLP)"
    description: >
      Tasas del Swap Promedio Cámara (SPC) en pesos chilenos para plazos
      3M, 6M, 9M, 1Y, 2Y, 5Y, 10Y. El SPC es la tasa swap referenciada
      a la TPM overnight. Útil para preguntas sobre expectativas de TPM,
      curva de swaps CLP, spreads OIS.
    segment: renta_fija_chile
    tags: [SPC, swap, CLP, pesos, TPM, OIS, cámara, expectativas monetarias, swaps]
    parquet: curva_spc_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/curva_spc_clp.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, spc_3m_clp, spc_6m_clp, spc_9m_clp, spc_1y_clp, spc_2y_clp, spc_5y_clp, spc_10y_clp]

  - query_id: spc_uf_curva
    name: "Curva Swap Promedio Cámara en UF (SPC UF)"
    description: >
      Tasas del Swap Promedio Cámara referenciadas a UF para plazos 3M y 1Y.
      Refleja expectativas de tasas reales de corto y mediano plazo.
    segment: renta_fija_chile
    tags: [SPC, swap UF, tasa real, cámara, 3M, 1Y, UF, inflación real]
    parquet: curva_spc_uf.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/curva_spc_uf.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual real"
    frequency: diario
    columns: [fecha, spc_3m_uf, spc_1y_uf]

  # ── RENTA FIJA EEUU ───────────────────────────────────────────────────────

  - query_id: curva_ust
