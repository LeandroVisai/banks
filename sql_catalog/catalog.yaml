  # ── COMMODITIES ───────────────────────────────────────────────────────────

  - query_id: precio_cobre
    name: "Precio del cobre histórico"
    description: >
      Serie histórica del precio del cobre en centavos de dólar por libra (c/lb)
      o dólares por tonelada métrica (USD/TM). Fuente: Bloomberg/LME.
      Determinante clave del tipo de cambio CLP y de las exportaciones chilenas.
    segment: commodities
    tags: [cobre, copper, LME, commodities, exportaciones, Chile, precio, USD]
    parquet: commodities.parquet
    sql: |
      SELECT strftime(date, '%Y-%m-%d') AS fecha, value AS cobre_usd_lb
      FROM read_parquet('{snapshots_dir}/commodities.parquet')
      WHERE series_id = 'cobre'
        AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      ORDER BY date DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "USD/lb"
    frequency: diario
    columns: [fecha, cobre_usd_lb]
