# sql_catalog/catalog.yaml
# Catálogo de queries analíticas sobre parquets del DW.
#
# Cada entrada = una pregunta analítica que el agente puede responder.
#
# Parámetros de sustitución en SQL:
#   {parquet_dir}    → ruta absoluta a data_pipeline/parquet/  (fuente primaria)
#   {snapshots_dir}  → ruta absoluta a data_pipeline/snapshots/ (solo series sin equivalente en parquet/)
#   {fecha_inicio}   → fecha ISO (YYYY-MM-DD)
#   {fecha_fin}      → fecha ISO (YYYY-MM-DD)
#   {limit}          → entero máximo de filas (default 200)
# ─────────────────────────────────────────────────────────────────────────────

version: "1.0"
snapshots_dir: data_pipeline/snapshots   # solo para series sin equivalente en parquet/
parquet_dir: data_pipeline/parquet       # fuente primaria — más fresco y más granular

queries:

  # ── MERCADO CAMBIARIO ─────────────────────────────────────────────────────

  - query_id: usdclp_historico
    name: "Tipo de cambio USD/CLP histórico (fixing BCCh)"
    description: >
      Serie diaria del fixing USD/CLP publicado por el Banco Central de Chile.
      Útil para preguntas sobre el dólar, nivel del tipo de cambio,
      depreciación/apreciación del peso chileno.
    segment: mercado_cambiario
    tags: [dolar, USD, CLP, tipo de cambio, fixing, peso chileno, paridad, FX]
    parquet: clp_monto.parquet
    sql: |
      SELECT strftime(Fecha, '%Y-%m-%d') AS fecha, CLP AS usdclp
      FROM read_parquet('{parquet_dir}/clp_monto.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      ORDER BY Fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "CLP por USD"
    frequency: diario
    columns: [fecha, usdclp]

  - query_id: indice_monedas_latam
    name: "Índice de monedas LATAM, comparables y commodities"
    description: >
      Índices agregados de monedas latinoamericanas (LATAM), monedas comparables
      a Chile y monedas de países exportadores de commodities. Mide la fortaleza
      relativa del CLP frente a su grupo de pares.
    segment: mercado_cambiario
    tags: [monedas, LATAM, comparables, commodities, índice, CLP relativo, pares]
    parquet: fx.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/fx.parquet')
        WHERE series_id IN ('monedas_latam', 'monedas_comparables', 'monedas_commodities')
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "índice base"
    frequency: diario
    columns: [fecha, monedas_latam, monedas_comparables, monedas_commodities]

  - query_id: forwards_clp_curva
    name: "Forward points USD/CLP (1M, 3M, 6M, 12M)"
    description: >
      Forward points del dólar-peso para plazos 1M, 3M, 6M y 12M.
      Útil para preguntas sobre expectativas de tipo de cambio futuro,
      mercado de forwards y cobertura cambiaria.
    segment: mercado_cambiario
    tags: [forwards, FWD, dolar, CLP, plazo, cobertura, derivados cambiarios]
    parquet: forward_points.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Serie = '1M'  THEN Valor END) AS fwd_clp_1m,
        MAX(CASE WHEN Serie = '3M'  THEN Valor END) AS fwd_clp_3m,
        MAX(CASE WHEN Serie = '6M'  THEN Valor END) AS fwd_clp_6m,
        MAX(CASE WHEN Serie = '12M' THEN Valor END) AS fwd_clp_12m
      FROM read_parquet('{parquet_dir}/forward_points.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "puntos forward (CLP)"
    frequency: diario
    columns: [fecha, fwd_clp_1m, fwd_clp_3m, fwd_clp_6m, fwd_clp_12m]

  - query_id: microestructura_fx
    name: "Microestructura mercado cambiario (spread bid-ask, volatilidad, monto)"
    description: >
      Indicadores de microestructura del mercado spot USD/CLP: spread promedio
      de puntas bid-ask (%), volatilidad diaria de precio de transacciones,
      y monto transado en pesos chilenos. Mide liquidez y eficiencia del mercado.
    segment: mercado_cambiario
    tags: [bid ask, spread, volatilidad, monto transado, microestructura, liquidez mercado, spot]
    parquet: microestructura.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/microestructura.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "mixto (%, CLP)"
    frequency: diario
    columns: [fecha, spread_bid_ask_clp, vol_diaria_clp, monto_transado_spot_clp]

  # ── RENTA FIJA CHILE ──────────────────────────────────────────────────────

  - query_id: curva_btp_clp
    name: "Curva de rendimiento BTP (bonos del BCCh en pesos)"
    description: >
      Tasas de los bonos del Banco Central de Chile en pesos (BTP) para todos
      los plazos disponibles: 1Y, 2Y, 5Y, 7Y, 10Y, 15Y, 20Y, 25Y, 30Y.
      Útil para preguntas sobre la curva soberana en CLP, pendiente de la curva,
      tasas de largo plazo en pesos.
    segment: renta_fija_chile
    tags: [BTP, bonos, pesos, CLP, curva soberana, renta fija, BCCh, tasas largo plazo]
    parquet: btp_curva.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Tenor = '1Y'  THEN Valor END) AS btp_1y,
        MAX(CASE WHEN Tenor = '2Y'  THEN Valor END) AS btp_2y,
        MAX(CASE WHEN Tenor = '5Y'  THEN Valor END) AS btp_5y,
        MAX(CASE WHEN Tenor = '7Y'  THEN Valor END) AS btp_7y,
        MAX(CASE WHEN Tenor = '10Y' THEN Valor END) AS btp_10y,
        MAX(CASE WHEN Tenor = '15Y' THEN Valor END) AS btp_15y,
        MAX(CASE WHEN Tenor = '20Y' THEN Valor END) AS btp_20y,
        MAX(CASE WHEN Tenor = '25Y' THEN Valor END) AS btp_25y,
        MAX(CASE WHEN Tenor = '30Y' THEN Valor END) AS btp_30y
      FROM read_parquet('{parquet_dir}/btp_curva.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, btp_1y, btp_2y, btp_5y, btp_7y, btp_10y, btp_15y, btp_20y, btp_25y, btp_30y]

  - query_id: curva_btu_uf
    name: "Curva de rendimiento BTU (bonos del BCCh en UF)"
    description: >
      Tasas reales de los bonos del Banco Central de Chile en Unidades de Fomento
      (BTU/UF): 2Y, 5Y, 7Y, 10Y, 15Y, 20Y, 25Y, 30Y. Útil para preguntas sobre
      tasas reales de largo plazo, curva UF, comparación BTP vs BTU.
    segment: renta_fija_chile
    tags: [BTU, bonos UF, tasa real, inflación, curva UF, renta fija real, BCCh, BEI]
    parquet: btu_curva.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Tenor = '2Y'  THEN Valor END) AS btu_2y,
        MAX(CASE WHEN Tenor = '5Y'  THEN Valor END) AS btu_5y,
        MAX(CASE WHEN Tenor = '7Y'  THEN Valor END) AS btu_7y,
        MAX(CASE WHEN Tenor = '10Y' THEN Valor END) AS btu_10y,
        MAX(CASE WHEN Tenor = '15Y' THEN Valor END) AS btu_15y,
        MAX(CASE WHEN Tenor = '20Y' THEN Valor END) AS btu_20y,
        MAX(CASE WHEN Tenor = '25Y' THEN Valor END) AS btu_25y,
        MAX(CASE WHEN Tenor = '30Y' THEN Valor END) AS btu_30y
      FROM read_parquet('{parquet_dir}/btu_curva.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual real"
    frequency: diario
    columns: [fecha, btu_2y, btu_5y, btu_7y, btu_10y, btu_15y, btu_20y, btu_25y, btu_30y]

  - query_id: btp_btu_comparado
    name: "BTP vs BTU en plazos 5Y y 10Y (break-even de inflación implícita)"
    description: >
      Compara directamente bonos nominales (BTP) y reales (BTU) en los plazos
      5 y 10 años. La diferencia aproxima el break-even de inflación (BEI) implícita
      en el mercado. Útil para preguntas sobre expectativas de inflación de largo plazo.
    segment: renta_fija_chile
    tags: [BTP, BTU, break-even inflación, BEI, inflación implícita, 5Y, 10Y, nominal vs real]
    parquet: btp_curva.parquet
    sql: |
      SELECT
        strftime(b5.Fecha, '%Y-%m-%d') AS fecha,
        b5.Valor  AS btp_5y,
        u5.Valor  AS btu_5y,
        b5.Valor - u5.Valor  AS bei_5y,
        b10.Valor AS btp_10y,
        u10.Valor AS btu_10y,
        b10.Valor - u10.Valor AS bei_10y
      FROM read_parquet('{parquet_dir}/btp_curva.parquet') b5
      JOIN read_parquet('{parquet_dir}/btu_curva.parquet') u5
        ON b5.Fecha = u5.Fecha AND u5.Tenor = '5Y'
      JOIN read_parquet('{parquet_dir}/btp_curva.parquet') b10
        ON b5.Fecha = b10.Fecha AND b10.Tenor = '10Y'
      JOIN read_parquet('{parquet_dir}/btu_curva.parquet') u10
        ON b5.Fecha = u10.Fecha AND u10.Tenor = '10Y'
      WHERE b5.Tenor = '5Y'
        AND b5.Fecha >= '{fecha_inicio}' AND b5.Fecha <= '{fecha_fin}'
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, btp_5y, btu_5y, bei_5y, btp_10y, btu_10y, bei_10y]

  - query_id: spc_clp_curva
    name: "Curva Swap Promedio Cámara en pesos (SPC CLP)"
    description: >
      Tasas del Swap Promedio Cámara (SPC) en pesos chilenos para plazos
      3M, 6M, 9M, 12M, 18M, 2Y, 5Y, 10Y. Es una tasa swap de MERCADO del peso
      (OIS local), un dato de mercado y no una tasa oficial. Úsala para la
      curva de swaps CLP, su pendiente y spreads swap de mercado en pesos.
    segment: renta_fija_chile
    tags: [SPC, swap, CLP, pesos, OIS, cámara, swaps, curva swap, swap cámara]
    parquet: spc_hist.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Tenor = '3M'  THEN Valor END) AS spc_3m_clp,
        MAX(CASE WHEN Tenor = '6M'  THEN Valor END) AS spc_6m_clp,
        MAX(CASE WHEN Tenor = '9M'  THEN Valor END) AS spc_9m_clp,
        MAX(CASE WHEN Tenor = '12M' THEN Valor END) AS spc_1y_clp,
        MAX(CASE WHEN Tenor = '18M' THEN Valor END) AS spc_18m_clp,
        MAX(CASE WHEN Tenor = '2Y'  THEN Valor END) AS spc_2y_clp,
        MAX(CASE WHEN Tenor = '5Y'  THEN Valor END) AS spc_5y_clp,
        MAX(CASE WHEN Tenor = '10Y' THEN Valor END) AS spc_10y_clp
      FROM read_parquet('{parquet_dir}/spc_hist.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, spc_3m_clp, spc_6m_clp, spc_9m_clp, spc_1y_clp, spc_18m_clp, spc_2y_clp, spc_5y_clp, spc_10y_clp]

  - query_id: spc_uf_curva
    name: "Curva Swap Promedio Cámara en UF (SPC UF)"
    description: >
      Tasas del Swap Promedio Cámara referenciadas a UF para plazos 3M y 1Y.
      Refleja expectativas de tasas reales de corto y mediano plazo.
    segment: renta_fija_chile
    tags: [SPC, swap UF, tasa real, cámara, 3M, 1Y, UF, inflación real]
    parquet: curva_spc_uf.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/curva_spc_uf.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual real"
    frequency: diario
    columns: [fecha, spc_3m_uf, spc_1y_uf]

  # ── RENTA FIJA EEUU ───────────────────────────────────────────────────────

  - query_id: curva_ust
    name: "Curva de rendimiento US Treasuries (UST)"
    description: >
      Tasas de los bonos del Tesoro de Estados Unidos (US Treasuries) para
      plazos 2Y, 5Y, 10Y, 20Y y 30Y. Útil para preguntas sobre la curva
      soberana americana, pendiente 2Y-10Y, tasas externas.
    segment: renta_fija_eeuu
    tags: [UST, US Treasury, bonos EEUU, curva americana, Fed, tasas externas, 10Y, 2Y]
    parquet: ust.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/ust.parquet')
        WHERE date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, ust_2y, ust_5y, ust_10y, ust_20y, ust_30y]

  # ── TASAS MONETARIAS CHILE ────────────────────────────────────────────────

  - query_id: spreads_dap_swap_clp
    name: "Spreads DAP vs Swap interbancario en CLP (3M, 6M, 12M)"
    description: >
      Spreads entre depósitos a plazo fijo (DAP) y el swap interbancario CLP
      en plazos 3M, 6M y 12M. Mide tensiones en el mercado de crédito bancario.
      Nota: prime spreads no disponibles en esta fuente.
    segment: tasas_monetarias_chile
    tags: [DAP, spread, swap, CLP, depósito, tensión, liquidez bancaria, tasa captación]
    parquet: spread_dap_swap.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Serie = '3M'  THEN Valor END) AS spread_dap_swap_3m_clp,
        MAX(CASE WHEN Serie = '6M'  THEN Valor END) AS spread_dap_swap_6m_clp,
        MAX(CASE WHEN Serie = '12M' THEN Valor END) AS spread_dap_swap_12m_clp
      FROM read_parquet('{parquet_dir}/spread_dap_swap.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "puntos base (bp)"
    frequency: diario
    columns: [fecha, spread_dap_swap_3m_clp, spread_dap_swap_6m_clp, spread_dap_swap_12m_clp]

  - query_id: pdbc_bolsa
    name: "Tasas PDBC bolsa por plazo (7d, 30d, 90d, 180d, 360d)"
    description: >
      Tasas de los Pagarés Descontables del Banco Central de Chile (PDBC)
      transados en bolsa en los plazos 7, 30, 90, 180 y 360 días.
      Instrumentos de política monetaria emitidos por el BCCh.
    segment: tasas_monetarias_chile
    tags: [PDBC, pagaré, BCCh, bolsa, política monetaria, instrumento corto plazo, liquidez]
    parquet: tasas_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_clp.parquet')
        WHERE series_id LIKE 'pdbc_%'
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, pdbc_bolsa_7d, pdbc_bolsa_30, pdbc_bolsa_90, pdbc_bolsa_180, pdbc_bolsa_360]

  - query_id: tib_mercado
    name: "Mercado interbancario (TIB) — spread TIB-TPM y monto transado"
    description: >
      Spread de la Tasa Interbancaria (TIB) sobre la TPM en puntos base,
      y monto transado en el mercado interbancario overnight de Chile.
      Útil para medir tensiones de liquidez entre bancos.
    segment: tasas_monetarias_chile
    tags: [TIB, interbancario, overnight, liquidez, spread, monto, TPM]
    parquet: tib_monto_transado.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        "Spread TIB-TPM" AS tib_spread,
        Monto AS tib_monto
      FROM read_parquet('{parquet_dir}/tib_monto_transado.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      ORDER BY Fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-90d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 100
    unit: "bps y MM CLP"
    frequency: diario
    columns: [fecha, tib_spread, tib_monto]

  # ── TASAS USD / MERCADO INTERNACIONAL ────────────────────────────────────

  - query_id: spread_onshore_dap_usd
    name: "Spread on-shore DAP USD (1M, 3M, 6M, 12M)"
    description: >
      Spread entre depósitos a plazo en dólares (DAP USD) y tasas de referencia
      internacional, en plazos 1M, 3M, 6M y 12M. Mide el costo de captación
      en dólares en el sistema bancario chileno.
    segment: tasas_internacionales
    tags: [DAP USD, spread, dolar, on-shore, 1M, 3M, 6M, 12M, tasa captación, sistema bancario]
    parquet: tasas_usd_mn.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_usd_mn.parquet')
        WHERE series_id LIKE 'spread_on_shore_%'
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "puntos base (bp)"
    frequency: diario
    columns: [fecha, spread_on_shore_dap_1m, spread_on_shore_dap_3m, spread_on_shore_dap_6m, spread_on_shore_dap_12m]

  - query_id: tasas_tado
    name: "Tasas TADO (1M, 3M, 6M, 12M)"
    description: >
      Tasa TADO (Tasa de Depósitos en Dólares en el Exterior) en plazos 1M,
      3M, 6M y 12M. Benchmark de fondeo en dólares para bancos chilenos
      con acceso a mercados internacionales.
    segment: tasas_internacionales
    tags: [TADO, dolar, exterior, fondeo, 1M, 3M, 6M, 12M, tasa internacional, offshore]
    parquet: tasas_usd_mn.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_usd_mn.parquet')
        WHERE series_id LIKE 'tado_%'
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, tado_1m, tado_3m, tado_6m, tado_12m]

  - query_id: sofr_plazos
    name: "Tasas SOFR por plazo (1M, 3M, 6M, 12M)"
    description: >
      Secured Overnight Financing Rate (SOFR) de la Fed en plazos 1M, 3M, 6M
      y 12M. Reemplazó al LIBOR USD como tasa de referencia global.
    segment: tasas_internacionales
    tags: [SOFR, LIBOR, Fed, dolar, tasa referencia, interbancario global, 1M, 3M, 6M, 12M]
    parquet: tasas_usd_mn.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_usd_mn.parquet')
        WHERE series_id IN ('sofr_1m','sofr_3m','sofr_6m','sofr_12m')
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, sofr_1m, sofr_3m, sofr_6m, sofr_12m]

  - query_id: prime_usd_plazos
    name: "Tasas Prime USD por plazo (30d, 90d, 180d, 360d)"
    description: >
      Tasas Prime en dólares para plazos 30, 90, 180 y 360 días. Referencia
      para fondeo interbancario en dólares en el mercado local.
    segment: tasas_internacionales
    tags: [Prime, USD, dolar, 30d, 90d, 180d, 360d, fondeo, tasa, interbancario]
    parquet: tasas_usd_mn.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_usd_mn.parquet')
        WHERE series_id LIKE 'prime_usd_%'
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, prime_usd_30, prime_usd_90, prime_usd_180, prime_usd_360]

  - query_id: curva_ois_sofr
    name: "Curva OIS (expectativas Fed funds 3M–10Y)"
    description: >
      Overnight Index Swaps para plazos 3M, 6M, 9M, 12M, 18M, 2Y, 5Y y 10Y.
      Refleja las expectativas del mercado sobre la tasa Fed Funds en el
      mediano plazo. Útil para preguntas sobre política monetaria de EEUU.
    segment: tasas_internacionales
    tags: [OIS, SOFR, Fed funds, expectativas, política monetaria EEUU, 3M, 6M, 12M, 24M]
    parquet: ois_hist.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Tenor = '3M'  THEN Valor END) AS ois_sofr_3m,
        MAX(CASE WHEN Tenor = '6M'  THEN Valor END) AS ois_sofr_6m,
        MAX(CASE WHEN Tenor = '9M'  THEN Valor END) AS ois_sofr_9m,
        MAX(CASE WHEN Tenor = '12M' THEN Valor END) AS ois_sofr_12m,
        MAX(CASE WHEN Tenor = '18M' THEN Valor END) AS ois_sofr_18m,
        MAX(CASE WHEN Tenor = '2Y'  THEN Valor END) AS ois_sofr_24m,
        MAX(CASE WHEN Tenor = '5Y'  THEN Valor END) AS ois_sofr_5y,
        MAX(CASE WHEN Tenor = '10Y' THEN Valor END) AS ois_sofr_10y
      FROM read_parquet('{parquet_dir}/ois_hist.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, ois_sofr_3m, ois_sofr_6m, ois_sofr_9m, ois_sofr_12m, ois_sofr_18m, ois_sofr_24m, ois_sofr_5y, ois_sofr_10y]

  - query_id: expectativas_tpm_mipr
    name: "Expectativas de TPM implícitas en MIPR (spreads 3M–2Y)"
    description: >
      Spreads de la curva MIPR (tasa swap interbancaria promedio) que revelan
      las expectativas del mercado sobre cambios en la Tasa de Política Monetaria
      (TPM) del BCCh en horizontes de 3M, 6M, 9M, 12M y 2Y.
    segment: politica_monetaria
    tags: [TPM, expectativas, MIPR, swap, política monetaria, BCCh, 3M, 6M, 12M, mercado implícito]
    parquet: mipr_spread_hist.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Tenor = '3M'  THEN Valor END) AS spread_mipr_3m,
        MAX(CASE WHEN Tenor = '6M'  THEN Valor END) AS spread_mipr_6m,
        MAX(CASE WHEN Tenor = '9M'  THEN Valor END) AS spread_mipr_9m,
        MAX(CASE WHEN Tenor = '12M' THEN Valor END) AS spread_mipr_12m,
        MAX(CASE WHEN Tenor = '2Y'  THEN Valor END) AS spread_mipr_24m
      FROM read_parquet('{parquet_dir}/mipr_spread_hist.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "bps"
    frequency: diario
    columns: [fecha, spread_mipr_3m, spread_mipr_6m, spread_mipr_9m, spread_mipr_12m, spread_mipr_24m]

  # ── LIQUIDEZ BANCARIA ─────────────────────────────────────────────────────

  - query_id: lcr_mx_bancos
    name: "LCR en moneda extranjera (sistémico y no sistémico)"
    description: >
      Ratio de Cobertura de Liquidez (LCR) en moneda extranjera (MX)
      para bancos sistémicos y no sistémicos. Mide la capacidad de los bancos
      de enfrentar salidas de liquidez en 30 días.
    segment: liquidez_bancaria
    tags: [LCR, liquidez, moneda extranjera, MX, sistémico, bancos, cobertura, Basilea III]
    parquet: lcr.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Categoria = 'Sistémico'    THEN LCR END) AS lcr_sistemico,
        MAX(CASE WHEN Categoria = 'No Sistémico' THEN LCR END) AS lcr_no_sistemico
      FROM read_parquet('{parquet_dir}/lcr.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "ratio"
    frequency: mensual
    columns: [fecha, lcr_sistemico, lcr_no_sistemico]

  - query_id: nsfr_mx_bancos
    name: "NSFR en moneda extranjera (sistémico y no sistémico)"
    description: >
      Net Stable Funding Ratio (NSFR) en moneda extranjera para bancos
      sistémicos y no sistémicos. Mide el financiamiento estable disponible
      vs requerido en un horizonte de 1 año.
    segment: liquidez_bancaria
    tags: [NSFR, financiamiento estable, moneda extranjera, MX, sistémico, bancos, Basilea III]
    parquet: nsfr.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Categoria = 'Sistémico'    THEN NSFR END) AS nsfr_sistemico,
        MAX(CASE WHEN Categoria = 'No Sistémico' THEN NSFR END) AS nsfr_no_sistemico
      FROM read_parquet('{parquet_dir}/nsfr.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "ratio"
    frequency: mensual
    columns: [fecha, nsfr_sistemico, nsfr_no_sistemico]

  - query_id: ratio_liquidez_obligaciones
    name: "Ratio de liquidez MX sobre obligaciones (sistémico y no sistémico)"
    description: >
      Ratio de activos líquidos en moneda extranjera sobre obligaciones del
      sistema bancario, por tipo de banco. Indicador sintético de la posición
      de liquidez sistémica en dólares.
    segment: liquidez_bancaria
    tags: [ratio liquidez, obligaciones, moneda extranjera, MX, sistémico, activos líquidos]
    parquet: ratio_liquidez_obligaciones.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        MAX(CASE WHEN Categoria = 'Sistémico'    THEN LCR_MX END) AS ratio_sistémico,
        MAX(CASE WHEN Categoria = 'No Sistémico' THEN LCR_MX END) AS ratio_no_sistémico
      FROM read_parquet('{parquet_dir}/ratio_liquidez_obligaciones.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      GROUP BY fecha
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "ratio"
    frequency: diario
    columns: [fecha, ratio_sistémico, ratio_no_sistémico]

  # ── COMMODITIES ───────────────────────────────────────────────────────────

  - query_id: precio_cobre
    name: "Precio del cobre histórico (USD/lb)"
    description: >
      Serie histórica del precio del cobre en dólares por libra (USD/lb).
      Fuente: parquet cobre_dxy (columna Cobre almacenada en USc/lb, se convierte ÷100).
      Determinante clave del tipo de cambio CLP y de las exportaciones chilenas.
    segment: commodities
    tags: [cobre, copper, LME, commodities, exportaciones, Chile, precio, USD]
    parquet: cobre_dxy.parquet
    sql: |
      SELECT
        strftime(Fecha, '%Y-%m-%d') AS fecha,
        Cobre / 100.0 AS cobre_usd_lb
      FROM read_parquet('{parquet_dir}/cobre_dxy.parquet')
      WHERE Fecha >= '{fecha_inicio}' AND Fecha <= '{fecha_fin}'
      ORDER BY Fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "USD/lb"
    frequency: diario
    columns: [fecha, cobre_usd_lb]
