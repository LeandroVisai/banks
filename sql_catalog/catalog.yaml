  # ── LIQUIDEZ BANCARIA ─────────────────────────────────────────────────────

  - query_id: lcr_mx_bancos
    name: "LCR en moneda extranjera (sistémico y no sistémico)"
    description: >
      Ratio de Cobertura de Liquidez (LCR) en moneda extranjera (MX)
      para bancos sistémicos, no sistémicos y total del sistema. El LCR mide
      la capacidad de los bancos de enfrentar salidas de liquidez en 30 días.
    segment: liquidez_bancaria
    tags: [LCR, liquidez, moneda extranjera, MX, sistémico, bancos, cobertura, Basilea III]
    parquet: liquidez_mx.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/liquidez_mx.parquet')
        WHERE series_id IN ('lcr_sistemico','lcr_no_sistemico','lcr_total')
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "ratio (%)"
    frequency: diario
    columns: [fecha, lcr_sistemico, lcr_no_sistemico, lcr_total]

