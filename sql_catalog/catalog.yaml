  # ── TASAS MONETARIAS CHILE ────────────────────────────────────────────────

  - query_id: spreads_dap_swap_clp
    name: "Spreads DAP y Prime vs Swap interbancario (CLP)"
    description: >
      Spreads entre depósitos a plazo fijo (DAP) y tasas prime de bancos
      frente al swap interbancario (Base_DMN), en plazos 1M, 3M, 6M y 12M.
      Útil para medir tensiones en el mercado de crédito bancario chileno.
    segment: tasas_monetarias_chile
    tags: [DAP, Prime, spread, swap, CLP, depósito, tensión, liquidez bancaria, tasa captación]
    parquet: tasas_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_clp.parquet')
        WHERE series_id LIKE 'spread_%_clp'
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "puntos base (bp)"
    frequency: diario
    columns: [fecha, spread_dap_swap_1m_clp, spread_dap_swap_3m_clp, spread_dap_swap_6m_clp, spread_dap_swap_12m_clp, spread_prime_swap_1m_clp, spread_prime_swap_3m_clp, spread_prime_swap_6m_clp, spread_prime_swap_12m_clp]

  - query_id: pdbc_bolsa
    name: "Tasas PDBC bolsa por plazo (7d, 30d, 90d, 180d, 360d)"
    description: >
      Tasas de los Pagarés Descontables del Banco Central de Chile (PDBC)
      transados en bolsa en los plazos 7, 30, 90, 180 y 360 días.
      Instrumentos de política monetaria emitidos por el BCCh.
    segment: tasas_monetarias_chile
    tags: [PDBC, pagaré, BCCh, bolsa, política monetaria, instrumento corto plazo, liquidez]
    parquet: tasas_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_clp.parquet')
        WHERE series_id LIKE 'pdbc_%'
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-365d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 200
    unit: "% anual"
    frequency: diario
    columns: [fecha, pdbc_bolsa_7d, pdbc_bolsa_30, pdbc_bolsa_90, pdbc_bolsa_180, pdbc_bolsa_360]

  - query_id: tib_mercado
    name: "Tasa Interbancaria (TIB) — tasa y monto transado"
    description: >
      Tasa y monto de las operaciones en el mercado interbancario de Chile (TIB).
      La TIB es la referencia de liquidez overnight entre bancos. Útil para
      preguntas sobre liquidez bancaria, spread TIB-TPM, tensiones interbancarias.
    segment: tasas_monetarias_chile
    tags: [TIB, interbancario, overnight, liquidez, tasa, monto, overnight, spread TPM]
    parquet: tasas_clp.parquet
    sql: |
      PIVOT (
        SELECT strftime(date, '%Y-%m-%d') AS fecha, series_id, value
        FROM read_parquet('{snapshots_dir}/tasas_clp.parquet')
        WHERE series_id IN ('tib_tasa', 'tib_monto')
          AND date >= '{fecha_inicio}' AND date <= '{fecha_fin}'
      )
      ON series_id
      USING FIRST(value)
      ORDER BY fecha DESC
      LIMIT {limit}
    params:
      - name: fecha_inicio
        type: date
        default: "-90d"
      - name: fecha_fin
        type: date
        default: "hoy"
      - name: limit
        type: int
        default: 100
    unit: "% y MM CLP"
    frequency: diario
    columns: [fecha, tib_tasa, tib_monto]

  # ── TASAS USD / MERCADO INTERNACIONAL ────────────────────────────────────

