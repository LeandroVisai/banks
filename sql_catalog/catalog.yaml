    frequency: diario
    columns: [fecha, nsfr_sistemico, nsfr_no_sistemico, nsfr_total]

  - query_id: ratio_liquidez_obligaciones
    name: "Ratio de liquidez sobre obligaciones totales MX"
    description: >
      Ratio de activos líquidos en moneda extranjera sobre obligaciones totales
      del sistema bancario. Indicador sintético de la posición de liquidez
      sistémica en dólares.
    segment: liquidez_bancaria
    tags: [ratio liquidez, obligaciones, moneda extranjera, MX, sistémico, activos líquidos]
