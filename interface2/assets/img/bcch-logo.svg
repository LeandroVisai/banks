<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Banco Central de Chile">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D4B68A"/>
            <stop offset="100%" stop-color="#BF9C69"/>
        </linearGradient>
    </defs>
    <!-- Outer hexagon (institutional) -->
    <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
             fill="#001730" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Inner geometric (currency / pillar) -->
    <g transform="translate(32,32)">
        <line x1="-14" y1="-10" x2="14" y2="-10" stroke="#BF9C69" stroke-width="2" stroke-linecap="round"/>
        <line x1="-14" y1="10" x2="14" y2="10" stroke="#BF9C69" stroke-width="2" stroke-linecap="round"/>
        <line x1="-10" y1="-10" x2="-10" y2="10" stroke="#BF9C69" stroke-width="2"/>
        <line x1="-2" y1="-10" x2="-2" y2="10" stroke="#BF9C69" stroke-width="2"/>
        <line x1="6" y1="-10" x2="6" y2="10" stroke="#BF9C69" stroke-width="2"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#C00000" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
    </g>
</svg>
