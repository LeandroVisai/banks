  - id: duracion_rfl_csv
    file: duracion_rfl_csv.parquet
    chart_type: "line"
    name: "Duración cartera de BTP"
    description: >
      Serie de duración cartera de btp para el seguimiento del segmento de CSV y seguros. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas Duracion_Cartera. Cubre el período entre 2024-01-02 y 2026-05-29. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: csv_seguros
    unit: "N/A"
    date_range: ["2019-11-29", "2026-07-15"]
    columns:
      - {name: fecha, type: TIMESTAMP}
      - {name: Duracion, type: DOUBLE}
  - id: flujo_spot_csv
    file: flujo_spot_csv.parquet
    chart_type: "bar_neto_cum_interactive"
    name: "Flujos spot acumulados"
    description: >
      Serie de flujos spot acumulados (us$ mill.) para el seguimiento del segmento de CSV y seguros. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas No Afecto, Afecto. Cubre el período entre 2022-01-03 y 2026-05-29. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: csv_seguros
    unit: "US$ Mill."
    date_range: ["2022-01-03", "2026-07-15"]
    columns:
      - {name: Fecha, type: TIMESTAMP}
      - {name: No Afecto, type: DOUBLE}
      - {name: Afecto, type: DOUBLE}

  - id: posicion_csv_cambiario
    file: posicion_csv_cambiario.parquet
    chart_type: "pos_bar_delta_interactive"
    name: "Posición cambiaria histórica"
    description: >
      Serie de posición cambiaria histórica (us$ mill.) para el seguimiento del segmento de CSV y seguros. Permite monitorear su evolución temporal y comparar niveles entre instituciones, plazos o categorías cuando corresponda. Incluye las métricas 1 a 90 dias, 91 a 360 dias, Mayor a 360 dias. Cubre el período entre 2014-01-02 y 2026-05-28. La unidad principal de análisis es US$ Mill.. Es útil para análisis de coyuntura, identificación de cambios de tendencia y lectura comparada con otras variables del tablero.
    segment: csv_seguros
    unit: "US$ Mill."
    date_range: ["2014-01-02", "2026-07-14"]
