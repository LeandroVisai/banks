# =============================================================================
# series_catalog.yaml — Catálogo de series de tiempo para el chatbot.
#
# Cada serie se extrae del data warehouse (mesadineOLTP_, dbo.Base_DMN, etc.)
# vía las queries de querys/Monitor.py y se materializa en parquet.
#
# Formato de cada serie:
#   id:           identificador único, snake_case
#   name:         nombre legible
#   category:     grupo (un archivo parquet por categoría)
#   unit:         "% anual" | "CLP por USD" | "USD/lb" | "bp" | etc.
#   frequency:    diario | mensual | trimestral
#   source:       BCCh | Bloomberg | INE | LME | NYMEX | Fed | DACE
#   variable:     mapeo a taxonomy.py (TASA_INTERES, INFLACION, etc.)
#   tenor:        opcional; para curvas (5Y, 10Y, etc.)
#   sql_table:    tabla SQL Server de origen
#   sql_column:   columna que contiene el valor (en el formato wide original)
#   description:  texto que el LLM ve cuando explora el catálogo
#
# Convenciones:
#   - Las tasas porcentuales del DW vienen como fracción (0.085 = 8.5%).
#     extract.py las multiplica por 100 si `multiply_by_100: true`.
#   - Para spreads en bps, multiplicar por 10000 si vienen en fracción.
# =============================================================================

categories:

  # ─── TASAS CLP — DAP / Prime / Swap ──────────────────────────────────────
