  # ─── LIQUIDEZ MX (LCR / NSFR / Cobertura) ────────────────────────────────
  liquidez_mx:
    description: "Indicadores de liquidez bancaria en moneda extranjera"
    parquet_file: liquidez_mx.parquet
    series:
      - id: lcr_total
        name: "LCR Total"
        unit: "ratio"
        frequency: mensual
        source: SBIF/DACE
        sql_table: mesadineOLTP_.c49.indicadoresMonitoreo
        derivation: "sum(activosLiquidos)/sum(egresosNetos)"
        description: "Liquidity Coverage Ratio agregado"

      - id: lcr_sistemico
        name: "LCR Bancos Sistémicos"
        unit: "ratio"
        frequency: mensual
        source: SBIF/DACE
        sql_table: mesadineOLTP_.c49.indicadoresMonitoreo
        derivation: "sum_filter(Categoria='Sistémico')"

      - id: lcr_no_sistemico
        name: "LCR Bancos No Sistémicos"
        unit: "ratio"
        frequency: mensual
        source: SBIF/DACE
        sql_table: mesadineOLTP_.c49.indicadoresMonitoreo
        derivation: "sum_filter(Categoria='No Sistémico')"

      - id: nsfr_total
        name: "NSFR Total"
        unit: "ratio"
        frequency: mensual
        source: SBIF/DACE
        sql_table: mesadineOLTP_.c49.indicadoresMonitoreo
        derivation: "sum(fuenteFinanciamientoEstable)/sum(financiamientoEstableRequerido)"

      - id: nsfr_sistemico
        name: "NSFR Bancos Sistémicos"
        unit: "ratio"
        frequency: mensual
        source: SBIF/DACE
        sql_table: mesadineOLTP_.c49.indicadoresMonitoreo
        derivation: "sum_filter(Categoria='Sistémico')"

      - id: nsfr_no_sistemico
        name: "NSFR Bancos No Sistémicos"
        unit: "ratio"
        frequency: mensual
        source: SBIF/DACE
        sql_table: mesadineOLTP_.c49.indicadoresMonitoreo
        derivation: "sum_filter(Categoria='No Sistémico')"

      - id: ratio_liq_obligaciones_total
        name: "Ratio Liquidez/Obligaciones 30d (Total)"
        unit: "ratio"
        frequency: diario
        source: DACE
        sql_table: Outputs.Bancos.Ratio_Cobertura_MX_30d_Historico
        derivation: "sum(Liquidez)/(sum(DAP)+sum(Creditos_externos))*0.75"

      - id: ihh_liquidez_mx
        name: "Concentración liquidez MX (IHH)"
        unit: "índice HHI"
        frequency: diario
        source: BCCh/StockHistorico.RIM
        sql_table: MesadineOLTP_.StockHistorico.RIM
        derivation: "Herfindahl–Hirschman sobre BCCh+Corresponsales"

  # ─── CALIDAD DEL MERCADO ─────────────────────────────────────────────────
  microestructura:
    description: "Calidad del mercado spot CLP — bid-ask, volatilidad"
    parquet_file: microestructura.parquet
    series:
      - id: spread_bid_ask_clp
        name: "Spread bid-ask USD/CLP (Datatec)"
        unit: "%"
        frequency: diario
        source: Datatec
        sql_table: Inputs.Spot.Datatec_bid_ask_diario
        sql_column: "[Gap/Price]"
        description: "Promedio amplitud puntas USD/CLP"

      - id: vol_diaria_clp
        name: "Volatilidad diaria USD/CLP"
        unit: "%"
        frequency: diario
        source: Datatec
        sql_table: Inputs.Spot.Datatec_volatilidad_diaria
        sql_column: Volatilidad
        multiply_by: 1000

      - id: monto_transado_spot_clp
        name: "Monto transado spot USD/CLP"
        unit: "USD millones"
        frequency: diario
        source: DACE
        sql_table: dbo.Base_DMN
        sql_column: "[Monto transado]"
