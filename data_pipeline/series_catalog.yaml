# =============================================================================
# series_catalog.yaml — Catálogo de series que extract.py extrae del DW
#                        y materializa como parquets en snapshots/.
#
# IMPORTANTE: Este catálogo solo contiene las series SIN equivalente en
# data_pipeline/parquet/ (fuente primaria, más fresca). Las series migradas
# a parquet/ ya no se generan aquí para evitar duplicación.
#
# Series en parquet/ (NO incluir aquí):
#   clp_monto, forward_points, btp_curva, btu_curva, spc_hist,
#   spread_dap_swap, tib_monto_transado, ois_hist, mipr_spread_hist,
#   lcr, nsfr, ratio_liquidez_obligaciones, cobre_dxy, petroleo_tcn, etc.
#
# Formato de cada serie:
#   id:           identificador único, snake_case
#   unit:         "% anual" | "CLP por USD" | "bp" | etc.
#   frequency:    diario | mensual | trimestral
#   sql_table:    tabla SQL Server de origen
#   sql_column:   columna que contiene el valor
# =============================================================================

categories:

  # ─── TASAS CLP — PDBC / TIB (solo series sin equivalente en parquet/) ──────
  tasas_clp:
    description: "Tasas PDBC bolsa y TIB — sin equivalente en parquet/"
    parquet_file: tasas_clp.parquet
    series:
      - id: spread_dap_swap_1m_clp
        name: "Spread DAP-Swap 1M"
        unit: "bp"
        frequency: diario
        source: DACE
        variable: TASA_INTERES_MERCADO
        tenor: 1M
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD DS 30]"
        multiply_by: 100
        description: "Diferencia DAP vs Swap interbancario, plazo 1 mes"

      - id: spread_dap_swap_3m_clp
        name: "Spread DAP-Swap 3M"
        unit: "bp"
        frequency: diario
        source: DACE
        variable: TASA_INTERES_MERCADO
        tenor: 3M
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD DS 90]"
        multiply_by: 100

      - id: spread_dap_swap_6m_clp
        name: "Spread DAP-Swap 6M"
        unit: "bp"
        frequency: diario
        source: DACE
        tenor: 6M
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD DS 180]"
        multiply_by: 100

      - id: spread_dap_swap_12m_clp
        name: "Spread DAP-Swap 12M"
        unit: "bp"
        frequency: diario
        source: DACE
        tenor: 12M
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD DS 360]"
        multiply_by: 100

      - id: spread_prime_swap_1m_clp
        name: "Spread Prime-Swap 1M"
        unit: "bp"
        frequency: diario
        source: DACE
        tenor: 1M
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD PS 30]"
        multiply_by: 100

      - id: spread_prime_swap_3m_clp
        name: "Spread Prime-Swap 3M"
        unit: "bp"
        frequency: diario
        source: DACE
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD PS 90]"
        multiply_by: 100

      - id: spread_prime_swap_6m_clp
        name: "Spread Prime-Swap 6M"
        unit: "bp"
        frequency: diario
        source: DACE
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD PS 180]"
        multiply_by: 100

      - id: spread_prime_swap_12m_clp
        name: "Spread Prime-Swap 12M"
        unit: "bp"
        frequency: diario
        source: DACE
        sql_table: dbo.Base_DMN
        sql_column: "[SPREAD PS 360]"
        multiply_by: 100

      - id: pdbc_bolsa_7d
        name: "PDBC Bolsa 7 días"
        unit: "% anual"
        frequency: diario
        source: BCCh
        variable: TASA_INTERES
        tenor: 7D
        sql_table: dbo.Base_DMN
        sql_column: "[PDBC BOLSA 7]"
        description: "Pagaré Descontable BCCh, mercado secundario, 7d"

      - id: pdbc_bolsa_30
        name: "PDBC Bolsa 30 días"
        unit: "% anual"
        frequency: diario
        source: BCCh
        sql_table: dbo.Base_DMN
        sql_column: "[PDBC BOLSA 30]"

      - id: pdbc_bolsa_90
        name: "PDBC Bolsa 90 días"
        unit: "% anual"
        frequency: diario
        source: BCCh
        sql_table: dbo.Base_DMN
        sql_column: "[PDBC BOLSA 90]"

      - id: pdbc_bolsa_180
        name: "PDBC Bolsa 180 días"
        unit: "% anual"
        frequency: diario
        source: BCCh
        sql_table: dbo.Base_DMN
        sql_column: "[PDBC BOLSA 180]"

      - id: pdbc_bolsa_360
        name: "PDBC Bolsa 360 días"
        unit: "% anual"
        frequency: diario
        source: BCCh
        sql_table: dbo.Base_DMN
        sql_column: "[PDBC BOLSA 360]"

      - id: tib_tasa
        name: "TIB — Tasa Interbancaria (ponderada)"
        unit: "% anual"
        frequency: diario
        source: BCCh
        variable: TASA_INTERES
        sql_table: mesadineOLTP_.Interbancario.Transacciones
        derivation: "weighted_avg(Tasa, Monto) groupby Fecha"
        description: "Tasa interbancaria diaria, ponderada por monto transado"

      - id: tib_monto
        name: "TIB — Monto transado"
        unit: "CLP"
        frequency: diario
        source: BCCh
        sql_table: mesadineOLTP_.Interbancario.Transacciones
        derivation: "sum(Monto) groupby Fecha"

