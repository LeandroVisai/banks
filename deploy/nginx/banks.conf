# Banks RAG — Nginx reverse proxy
# Copiar a /etc/nginx/sites-available/banks.conf
# ln -s /etc/nginx/sites-available/banks.conf /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

upstream banks_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name banks.internal;
    return 301 https://$host$request_uri;
}

# ── HTTPS principal ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name banks.internal;

    ssl_certificate     /etc/ssl/certs/banks.crt;
    ssl_certificate_key /etc/ssl/private/banks.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de seguridad
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/banks_access.log combined;
    error_log  /var/log/nginx/banks_error.log  warn;

    # Tamaño máximo de body (para uploads de documentos futuros)
    client_max_body_size 50M;

    # ── /metrics: solo red interna (Prometheus scrape) ──────────────────
    location /metrics {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://banks_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Endpoints públicos (healthz, redoc, docs) ────────────────────────
    location ~ ^/(healthz|readyz|docs|redoc|openapi\.json) {
        proxy_pass http://banks_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── API principal ────────────────────────────────────────────────────
    location / {
        proxy_pass http://banks_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout generoso para generación LLM (~2min para preguntas largas)
        proxy_read_timeout  120s;
        proxy_send_timeout   30s;
        proxy_connect_timeout 10s;

        # Sin buffering para streaming SSE futuro
        proxy_buffering    off;
        proxy_cache        off;
    }
}
